<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Star</title>
    <link rel="stylesheet" href="star.css">
</head>
<body>
    <div class="container">
        <!-- Star with glow and tiny stars -->
        <div class="star-wrapper">
            <div class="star-glow"></div>
            <!-- Main star -->
            <div class="star"></div>
            
            <!-- Tiny stars around the main star -->
            <div class="tiny-star tiny-star-1"></div>
            <div class="tiny-star tiny-star-2"></div>
            <div class="tiny-star tiny-star-3"></div>
            <div class="tiny-star tiny-star-4"></div>
            <div class="tiny-star tiny-star-5"></div>
            <div class="tiny-star tiny-star-6"></div>
            <div class="tiny-star tiny-star-7"></div>
            <div class="tiny-star tiny-star-8"></div>
            <div class="tiny-star tiny-star-9"></div>
        </div>
    </div>
</body>
</html>
